worker_processes 1;

error_log "E:/Code/AI project/var/nginx/error.log" warn;
pid "E:/Code/AI project/var/nginx/nginx.pid";

events {
    worker_connections 1024;
}

http {
    include "C:/tools/nginx-1.31.8/conf/mime.types";
    default_type application/octet-stream;
    access_log "E:/Code/AI project/var/nginx/access.log";
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 30m;
    server_tokens off;

    server {
        listen 127.0.0.1:8090;
        server_name _;
        root "E:/Code/AI project/apps/web/dist";
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /health {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
        }

        location = /openapi.json {
            allow 127.0.0.1;
            deny all;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|svg|woff2)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }
}
