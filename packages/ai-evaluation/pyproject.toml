[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "resolve-ai-evaluation"
version = "0.1.0"
description = "Dataset validation and evaluation-run client for the RESOLVE AI evaluation lab"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.scripts]
resolve-eval = "resolve_eval.cli:main"

[tool.setuptools.packages.find]
include = ["resolve_eval*"]