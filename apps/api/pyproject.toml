[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "resolve-api"
version = "0.1.0"
description = "RESOLVE - Intelligent exception management, investigation and workflow resolution platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2.0.36",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "redis>=5.0",
  "celery>=5.4",
  "httpx>=0.27",
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
  "cryptography>=43.0",
  "email-validator>=2.2",
  "python-multipart>=0.0.9",
  "tenacity>=9.0",
  "structlog>=24.4",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "pillow>=10.4",
  "pytesseract>=0.3.13",
  "slowapi>=0.1.9",
  "boto3>=1.35",
  "reportlab>=4.2",
  "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-python-dateutil",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning:celery.*",
  "ignore::DeprecationWarning:kombu.*",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "S"]
ignore = [
  "B008",   # FastAPI Depends() in defaults is idiomatic
  "S101",   # assert is fine in tests
  "S105", "S106",
  "SIM102",
  "E501",
  "B904",
  "UP047",
  "UP046",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108", "S311"]
"app/modules/ai_evaluation/*" = ["S311"]
"app/scripts/*" = ["S311", "S108"]
"app/core/security.py" = ["S105"]
"app/config/settings.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
disallow_untyped_defs = false
files = ["app"]
