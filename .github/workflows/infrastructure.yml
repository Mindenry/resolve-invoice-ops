name: Infrastructure

on:
  push:
    paths:
      - "docker-compose.yml"
      - "docker-compose.dev.yml"
      - "infrastructure/**"
      - "apps/api/Dockerfile"
      - "apps/web/Dockerfile"
      - ".github/workflows/infrastructure.yml"
  pull_request:
    paths:
      - "docker-compose.yml"
      - "docker-compose.dev.yml"
      - "infrastructure/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-db-password
      S3_ACCESS_KEY: ci-only-s3-key
      S3_SECRET_KEY: ci-only-s3-secret
      N8N_ENCRYPTION_KEY: ci-only-encryption-key
      N8N_WEBHOOK_SECRET: ci-only-webhook-secret
      N8N_OWNER_PASSWORD: ci-only-owner-password
      RESOLVE_AUTOMATION_EMAIL: ci@example.com
      RESOLVE_AUTOMATION_PASSWORD: ci-only-automation-password
      RESOLVE_AUTOMATION_ORG_ID: 00000000-0000-0000-0000-000000000000
      RESOLVE_ORGANIZATION_SLUG: northwind
      GRAFANA_PASSWORD: ci-only-grafana-password
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        run: cp .env.example .env
      - name: Validate compose configuration
        run: docker compose config -q
      - name: Validate compose dev override
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
      - name: Validate compose monitoring profile
        run: docker compose --profile monitoring config -q
      - name: Validate n8n workflow JSON
        run: |
          python - <<'PY'
          import json, pathlib
          for path in pathlib.Path("infrastructure/n8n/workflows").glob("*.json"):
              json.loads(path.read_text())
              print("ok", path.name)
          PY
      - name: Validate evaluation dataset
        run: |
          python -m pip install -e packages/ai-evaluation
          resolve-eval validate datasets/evaluation/investigation_samples.json