# Development override: hot reload for API and Vite dev server for the UI.
services:
  api:
    build:
      target: runtime
    environment:
      ENV: development
      DEBUG: "true"
      AUTO_CREATE_SCHEMA: "false"
      LOG_JSON: "false"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./apps/api/app:/app/app
      - ./apps/api/alembic:/app/alembic
      - ./datasets:/datasets:ro
      - api_var:/app/var

  web:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    environment:
      VITE_API_PROXY: http://api:8000
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "5173:5173"

  worker:
    volumes:
      - ./apps/api/app:/app/app
      - api_var:/app/var

  beat:
    volumes:
      - ./apps/api/app:/app/app

volumes:
  api_var:
  web_node_modules: